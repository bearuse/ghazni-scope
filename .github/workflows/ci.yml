name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm clang lld
      - name: host unit tests (this checkout)
        run: python3 tests/test_host.py
      - name: FreeRTOS on Linux (POSIX port)
        run: python3 tests/run_freertos.py posix
      - name: FreeRTOS on Cortex-M3 (QEMU mps2-an385)
        run: python3 tests/run_freertos.py mps2
      - name: the same through RTT (QEMU's GDB server as the debug probe)
        run: python3 tests/run_freertos.py mps2-rtt
      - name: web page in a browser (Playwright, Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          node tests/test_ui.js
      # the package as users get it: installed with pipx, then the same tests
      # run against the installed command and module
      - name: install with pipx
        run: |
          pipx install .
          pipx inject ghazni-scope pyserial
          ghazni-scope --version
      - name: tests against the installed package
        run: |
          PY="$(pipx environment --value PIPX_LOCAL_VENVS)/ghazni-scope/bin/python"
          SCOPE_INSTALLED=1 "$PY" tests/test_host.py
          SCOPE_INSTALLED=1 python3 tests/run_freertos.py posix
          SCOPE_INSTALLED=1 node tests/test_ui.js

  # ESP32 (ESP-IDF, two CPUs) in Espressif's QEMU, inside Espressif's image
  esp32:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: ESP32 demo built with ESP-IDF, run in QEMU, read by the tool
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . /opt/esp/idf/export.sh
          python3 tests/run_freertos.py esp32
